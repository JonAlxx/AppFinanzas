name: Android APK Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.0.3"
        required: true
        default: "v1.0.18"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease

      - name: Prepare APK
        id: apk
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_NAME="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$DISPATCH_TAG"
          fi

          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "APK not found at $APK_SOURCE" >&2
            find android/app/build/outputs -name "*.apk" -print >&2
            exit 1
          fi

          mkdir -p dist
          APK_PATH="dist/FinanzasApp-${TAG_NAME}.apk"
          cp "$APK_SOURCE" "$APK_PATH"

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasApp-${{ steps.apk.outputs.tag }}-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.apk.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "FinanzasApp $TAG_NAME" \
              --notes "APK generado automaticamente desde el commit $GITHUB_SHA."
          fi
